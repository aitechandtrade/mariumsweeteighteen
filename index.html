<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariyam's 18th Birthday Diary</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Dancing+Script:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --cover-color: #FFB7CE; 
            --spine-color: #e093ad;
            --page-color: #ffffff;
            --text-dark: #3a332f;
            --text-light: #5c524c;
            --accent: #f472b6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fce4ec;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.8) 2px, transparent 3px),
                radial-gradient(circle, rgba(255, 182, 193, 0.4) 4px, transparent 5px),
                linear-gradient(135deg, rgba(255,255,255,0.4) 25%, transparent 25%),
                linear-gradient(225deg, rgba(255,255,255,0.4) 25%, transparent 25%);
            background-size: 50px 50px, 80px 80px, 40px 40px, 40px 40px;
            background-position: 0 0, 25px 25px, 0 0, 20px 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-dark);
        }

        /* --- Cover Screen & Opening Animation --- */
        #cover-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background: rgba(252, 228, 236, 0.6);
            backdrop-filter: blur(4px);
            cursor: pointer;
            perspective: 1200px;
        }

        #cover-screen.opening {
            animation: coverFlyOut 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @keyframes coverFlyOut {
            0% {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
            100% {
                opacity: 0;
                transform: scale(1.15) rotateY(-30deg) translateX(-100px);
            }
        }

        .elegant-book-cover {
            background-color: var(--cover-color);
            width: min(380px, 88vw);
            height: min(520px, 78vh);
            border-radius: 4px 15px 15px 4px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1) inset, 15px 25px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 2px solid #ea9cb6;
            transform-origin: left center;
            transition: transform 0.4s ease;
        }

        #cover-screen:hover .elegant-book-cover {
            transform: scale(1.02) rotateY(-5deg);
        }

        .cover-doodle-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.35;
            pointer-events: none;
        }

        .cake-ribbon-svg {
            width: 70%;
            height: 70%;
            max-width: 280px;
            max-height: 280px;
        }

        .book-binding {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 35px;
            background: linear-gradient(90deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.05) 40%, rgba(255,255,255,0.2) 50%, rgba(0,0,0,0.1) 100%);
            border-right: 2px groove #df8aa6;
            z-index: 2;
        }

        .cover-content {
            text-align: center;
            padding: 20px;
            margin-left: 20px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            width: 80%;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 183, 206, 0.25);
            z-index: 3;
        }

        .cover-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.1rem, 9vw, 3.5rem);
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            line-height: 1.1;
            margin: 20px 0;
        }

        .cover-subtitle {
            font-family: 'Lora', serif;
            font-size: clamp(0.8rem, 3vw, 0.95rem);
            color: #fff0f5;
            font-style: italic;
            letter-spacing: 1px;
        }

        .floral-accent {
            color: #ffffff;
            font-size: 1.2rem;
            letter-spacing: 5px;
        }

        .open-prompt {
            position: absolute;
            bottom: 30px;
            background: rgba(255, 255, 255, 0.4);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 8px 25px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            border-radius: 20px;
        }

        /* --- Open Diary Layout & Entry Animation --- */
        #diary-container {
            display: none;
            width: 95%;
            max-width: 1000px;
            height: 85vh;
            background: var(--page-color);
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            position: relative;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.95);
        }

        #diary-container.visible {
            display: flex;
            animation: diaryScaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes diaryScaleIn {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .leather-spine {
            position: absolute;
            left: 50%;
            top: -5px;
            bottom: -5px;
            width: 4px;
            background: #e5dccf;
            transform: translateX(-50%);
            box-shadow: -2px 0 5px rgba(0,0,0,0.05), 2px 0 5px rgba(0,0,0,0.05);
            z-index: 5;
        }

        .bookmark-ribbon {
            position: absolute;
            left: 52%;
            top: -15px;
            width: 15px;
            height: 120px;
            background-color: var(--accent);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.15);
            z-index: 4;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
        }

        .book-spread {
            display: flex;
            height: calc(100% - 60px);
            width: 100%;
        }

        .page {
            flex: 1;
            padding: 50px 60px;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            background-color: #fcf8f2;
        }

        .left-page {
            border-right: 1px solid #f0e6dc;
            background: linear-gradient(to right, #ffffff 90%, #fcf8f5 100%);
        }

        .right-page {
            background: linear-gradient(to left, #ffffff 90%, #fcf8f5 100%);
        }

        /* Diary and Handwritten Font Settings */
        .diary-handwritten {
            font-family: 'Patrick Hand', cursive, sans-serif;
            font-size: 1.15rem;
            line-height: 1.8rem;
            color: #2b2b2b;
            letter-spacing: 0.02em;
        }

        .page-doodle {
            position: absolute;
            pointer-events: none;
            opacity: 0.22;
            z-index: 1;
        }
        .page-doodle.flower { bottom: 25px; right: 25px; width: 50px; height: 50px; }
        .page-doodle.heart { top: 25px; right: 25px; width: 35px; height: 35px; }
        .page-doodle.stars { bottom: 25px; left: 30px; width: 45px; height: 30px; }
        .page-doodle.sparkle { top: 25px; left: 30px; width: 35px; height: 35px; }

        .letter-content-wrap {
            position: relative;
            z-index: 2;
            height: 100%;
            overflow-y: auto;
            padding-right: 5px;
        }
        .letter-content-wrap::-webkit-scrollbar { width: 4px; }
        .letter-content-wrap::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }

        .centered-title {
            text-align: center;
            width: 100%;
            display: block;
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: var(--text-dark);
            margin-bottom: 10px;
            border-bottom: 1px solid #f0e6dc;
            padding-bottom: 10px;
        }

        .letter-text {
            white-space: pre-line;
            margin-bottom: 25px;
        }

        /* The letters use <br><br> to separate paragraphs, which renders as a
           full blank line (very loose). Turn the second <br> of each pair into
           a small controlled block gap instead, so paragraph spacing is tighter
           and consistent. */
        .diary-handwritten br + br {
            content: "";
            display: block;
            margin-top: 0.55em;
        }

        /* --- Navigation Footer --- */
        .diary-footer {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background: transparent;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-light);
            border: 1px solid #e0d5c8;
            padding: 8px 25px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .music-toggle {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid #e0d5c8;
            background: #fff;
            color: var(--accent);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            pointer-events: auto;
            touch-action: manipulation;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            transition: transform 0.2s;
        }

        .music-toggle:hover {
            transform: scale(1.08);
        }

        .music-toggle.playing {
            animation: musicPulse 1.6s ease-in-out infinite;
        }

        @keyframes musicPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        /* --- Outside-the-book photo placeholders --- */
        .outside-photo {
            position: fixed;
            width: 150px;
            height: 170px;
            object-fit: cover;
            background: #fff;
            border: 8px solid #fff;
            border-radius: 3px;
            box-shadow: 0 10px 22px rgba(0,0,0,0.22);
            z-index: 2;
            pointer-events: none;
        }

        .photo-one {
            top: 5%;
            left: 3%;
            transform: rotate(-9deg);
        }

        .photo-two {
            bottom: 5%;
            right: 3%;
            transform: rotate(8deg);
        }

        .page-indicator {
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            font-style: italic;
            color: #9c8e83;
        }

        /* --- Responsive: tablets & small laptops --- */
        @media (max-width: 900px) {
            #diary-container {
                width: 96%;
                height: 90vh;
            }

            .page {
                padding: 36px 30px;
            }

            .centered-title {
                font-size: 1.8rem;
            }

            .diary-handwritten {
                font-size: 1.05rem;
                line-height: 1.65rem;
            }

            .diary-footer {
                padding: 0 20px;
            }
        }

        /* --- Responsive: phones --- */
        @media (max-width: 640px) {
            body {
                overflow-y: auto;
                padding: 12px 0;
                min-height: 100vh;
                height: auto;
            }

            .cover-content {
                width: 92%;
                padding: 14px;
                margin-left: 10px;
            }

            .open-prompt {
                bottom: 16px;
                padding: 6px 18px;
                font-size: 0.75rem;
            }

            .outside-photo {
                width: 64px;
                height: 74px;
                border-width: 5px;
                z-index: 1;
            }

            .photo-one {
                top: 4px;
                left: 4px;
            }

            .photo-two {
                bottom: 4px;
                right: 4px;
            }

            #diary-container {
                width: 100%;
                max-width: 100%;
                height: 92vh;
                height: 92dvh;
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 2px 8px rgba(0,0,0,0.12), 0 18px 34px rgba(0,0,0,0.22);
            }

            .leather-spine,
            .bookmark-ribbon {
                display: none;
            }

            /* Mini bookmark tab standing in for the spine on single-page view */
            .mobile-bookmark {
                display: block;
                position: absolute;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 24px;
                height: 40px;
                background: var(--accent);
                clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%);
                box-shadow: 0 2px 5px rgba(0,0,0,0.18);
                z-index: 6;
            }

            /* Single visible page, diary paper texture, deckled inner border */
            .book-spread {
                flex-direction: row;
                height: calc(100% - 56px);
                overflow: hidden;
                position: relative;
            }

            .page {
                flex: none;
                width: 100%;
                height: 100%;
                padding: 34px 22px 26px;
                overflow-y: auto;
                background-color: #fffdf8;
                background-image:
                    repeating-linear-gradient(to bottom, transparent 0px, transparent 29px, rgba(176,137,104,0.10) 30px),
                    radial-gradient(circle, rgba(176,137,104,0.10) 1px, transparent 1.5px);
                background-size: 100% 30px, 18px 18px;
                box-shadow: inset 0 0 0 1px rgba(224,213,200,0.7);
            }

            .right-page {
                display: none;
            }

            .left-page {
                border-right: none;
                background-color: #fffdf8;
            }

            /* Folded-corner detail, bottom-right, for a page feel */
            .page::after {
                content: "";
                position: absolute;
                bottom: 0;
                right: 0;
                width: 30px;
                height: 30px;
                background: linear-gradient(135deg, transparent 50%, #f3e6d8 50%);
                box-shadow: -1px -1px 3px rgba(0,0,0,0.12);
                pointer-events: none;
                z-index: 1;
            }

            .letter-content-wrap {
                overflow-y: visible;
                height: auto;
            }

            .centered-title {
                font-size: 1.6rem;
                margin-top: 6px;
                margin-bottom: 10px;
                padding-bottom: 10px;
            }

            .diary-handwritten {
                font-size: 1.02rem;
                line-height: 1.6rem;
            }

            .diary-handwritten br + br {
                margin-top: 0.4em;
            }

            .page-doodle {
                opacity: 0.18;
                transform: scale(0.75);
            }

            .diary-footer {
                height: 56px;
                padding: 0 16px;
                border-top: 1px solid #f0e6dc;
            }

            .nav-btn {
                padding: 7px 16px;
                font-size: 0.78rem;
            }

            .page-indicator {
                font-size: 0.78rem;
            }

            /* Page-turn transition */
            @keyframes pageOutToLeft {
                to { transform: translateX(-6%); opacity: 0; }
            }
            @keyframes pageOutToRight {
                to { transform: translateX(6%); opacity: 0; }
            }
            @keyframes pageInFromRight {
                from { transform: translateX(6%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes pageInFromLeft {
                from { transform: translateX(-6%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }

            .page-turn-out-left { animation: pageOutToLeft 0.2s ease forwards; }
            .page-turn-out-right { animation: pageOutToRight 0.2s ease forwards; }
            .page-turn-in-right { animation: pageInFromRight 0.28s ease forwards; }
            .page-turn-in-left { animation: pageInFromLeft 0.28s ease forwards; }
        }

        @media (min-width: 641px) {
            .mobile-bookmark {
                display: none;
            }
        }

        @media (max-width: 360px) {
            .cover-title {
                font-size: 1.9rem;
            }

            .nav-btn {
                padding: 6px 12px;
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>

    <div id="cover-screen" onclick="openDiary()">
        <div class="elegant-book-cover">
            <div class="book-binding"></div>
            <div class="cover-doodle-bg">
                <svg viewBox="0 0 200 200" class="cake-ribbon-svg">
                    <path d="M100,25 C80,5 60,25 80,45 C95,55 100,45 100,45" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M100,25 C120,5 140,25 120,45 C105,55 100,45 100,45" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="100" cy="45" r="5" fill="rgba(255,255,255,0.7)"/>
                    <line x1="100" y1="52" x2="100" y2="65" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
                    <ellipse cx="100" cy="52" rx="2" ry="1" fill="#fff"/>
                    <path d="M 75,65 Q 100,60 125,65 L 125,85 Q 100,90 75,85 Z" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
                    <path d="M 65,85 Q 100,80 135,85 L 135,110 Q 100,115 65,110 Z" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
                    <path d="M 50,110 Q 100,105 150,110 L 150,145 Q 100,152 50,145 Z" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
                </svg>
            </div>
            <div class="cover-content">
                <div class="floral-accent top-floral">❀ ✿ ❀</div>
                <h1 class="cover-title">Mariyam's<br>18th Birthday</h1>
                <p class="cover-subtitle">A collection of memories, love, and chaos.</p>
                <div class="floral-accent bottom-floral">❀ ✿ ❀</div>
            </div>
            <div class="open-prompt">Click anywhere to open ✧</div>
        </div>
    </div>

    <div id="diary-container">
        <div class="leather-spine" id="leatherSpine"></div>
        <div class="bookmark-ribbon"></div>
        <div class="mobile-bookmark"></div>

        <audio id="bgMusic" src="song.mp3" loop preload="auto"></audio>
        <button id="musicToggle" class="music-toggle" onclick="toggleMusic()" aria-label="Play music">♪</button>

        <div class="book-spread">
            <div class="page left-page" id="leftPageContent"></div>
            <div class="page right-page" id="rightPageContent"></div>
        </div>

        <div class="diary-footer">
            <button class="nav-btn" id="prevBtn" onclick="prevSpread()" disabled>← Previous</button>
            <div class="page-indicator" id="pageIndicator">Spread 1 of 1</div>
            <button class="nav-btn" id="nextBtn" onclick="nextSpread()">Next →</button>
        </div>
    </div>

    <img src="picture1.png" alt="Memory photo 1" class="outside-photo photo-one">
    <img src="picture2.png" alt="Memory photo 2" class="outside-photo photo-two">

    <script>

            {
                left: `

                    <svg class="page-doodle heart" viewBox="0 0 50 50"><path d="M25,40 C25,40 10,25 10,15 C10,8 16,5 22,10 C25,13 25,13 28,10 C34,5 40,8 40,15 C40,25 25,40 25,40 Z" fill="#b08968"/></svg>

                    </div>
                `,
                right: `
                    <svg class="page-doodle stars" viewBox="0 0 50 50"><polygon points="25,5 30,18 45,18 32,26 37,40 25,30 13,40 18,26 5,18 20,18" fill="#b08968"/></svg>
                    <svg class="page-doodle sparkle" viewBox="0 0 50 50"><path d="M25,5 L28,20 L43,25 L28,30 L25,45 L22,30 L7,25 L22,20 Z" fill="#b08968"/></svg>

                    </div>

            },
            {
                left: `
                    <svg class="page-doodle heart" viewBox="0 0 50 50"><path d="M25,40 C25,40 10,25 10,15 C10,8 16,5 22,10 C25,13 25,13 28,10 C34,5 40,8 40,15 C40,25 25,40 25,40 Z" fill="#b08968"/></svg>
                    <div class="letter-content-wrap">

        let currentSpread = 0;
        let currentPage = 0;
        const flatPages = spreads.flatMap(s => [s.left, s.right]);

        function isMobileView() {
            return window.matchMedia('(max-width: 640px)').matches;
        }

        function resetScroll() {
            const bookSpread = document.querySelector('.book-spread');
            if (bookSpread) bookSpread.scrollTop = 0;
            document.querySelectorAll('.page').forEach(page => page.scrollTop = 0);
            document.querySelectorAll('.letter-content-wrap').forEach(wrap => wrap.scrollTop = 0);
            const diaryContainer = document.getElementById('diary-container');
            if (diaryContainer && diaryContainer.scrollIntoView) {
                diaryContainer.scrollIntoView({ block: 'start', behavior: 'auto' });
            }
        }

        function openDiary() {
            const cover = document.getElementById('cover-screen');
            const diary = document.getElementById('diary-container');

            cover.classList.add('opening');

            const music = document.getElementById('bgMusic');
            if (music) {
                music.volume = 0.5;
                music.play().catch(() => {
                    // Autoplay blocked by the browser — tap the music button to start it
                });
            }

            setTimeout(() => {
                cover.style.display = 'none';
                diary.classList.add('visible');
                if (isMobileView()) {
                    currentPage = 0;
                    renderMobilePage();
                } else {
                    renderSpread();
                }
            }, 800);
        }

        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            if (!music) return;
            if (music.paused) {
                music.play().catch(() => {
                    // If this fails, the file likely isn't reachable (e.g. song.mp3 missing)
                });
            } else {
                music.pause();
            }
        }

        // Keep the button's icon/state in sync with what the audio element is
        // actually doing, instead of guessing — this is what fixes cases where
        // the button and playback state fall out of sync.
        (function setupMusicButton() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('musicToggle');
            if (!music || !btn) return;

            const sync = () => {
                if (music.paused) {
                    btn.textContent = '▶';
                    btn.classList.remove('playing');
                    btn.setAttribute('aria-label', 'Play music');
                } else {
                    btn.textContent = '⏸';
                    btn.classList.add('playing');
                    btn.setAttribute('aria-label', 'Pause music');
                }
            };

            music.addEventListener('play', sync);
            music.addEventListener('pause', sync);
            music.addEventListener('ended', sync);
            sync();
        })();

        function renderSpread() {
            const spread = spreads[currentSpread];
            document.getElementById('leftPageContent').innerHTML = spread.left;
            document.getElementById('rightPageContent').innerHTML = spread.right;
            document.getElementById('rightPageContent').style.display = '';
            document.getElementById('pageIndicator').innerText = `Spread ${currentSpread + 1} of ${spreads.length}`;

            document.getElementById('prevBtn').disabled = currentSpread === 0;
            document.getElementById('nextBtn').disabled = currentSpread === spreads.length - 1;
            resetScroll();
        }

        function renderMobilePage(direction) {
            const leftEl = document.getElementById('leftPageContent');
            document.getElementById('rightPageContent').style.display = 'none';

            const applyContent = () => {
                leftEl.innerHTML = flatPages[currentPage];
                document.getElementById('pageIndicator').innerText = `Page ${currentPage + 1} of ${flatPages.length}`;
                document.getElementById('prevBtn').disabled = currentPage === 0;
                document.getElementById('nextBtn').disabled = currentPage === flatPages.length - 1;
                resetScroll();
            };

            if (!direction) {
                applyContent();
                return;
            }

            leftEl.classList.remove('page-turn-in-left', 'page-turn-in-right');
            leftEl.classList.add(direction === 'next' ? 'page-turn-out-left' : 'page-turn-out-right');

            setTimeout(() => {
                applyContent();
                leftEl.classList.remove('page-turn-out-left', 'page-turn-out-right');
                leftEl.classList.add(direction === 'next' ? 'page-turn-in-right' : 'page-turn-in-left');
                setTimeout(() => {
                    leftEl.classList.remove('page-turn-in-left', 'page-turn-in-right');
                }, 300);
            }, 200);
        }

        function nextSpread() {
            if (isMobileView()) {
                if (currentPage < flatPages.length - 1) {
                    currentPage++;
                    renderMobilePage('next');
                }
                return;
            }
            if (currentSpread < spreads.length - 1) {
                currentSpread++;
                renderSpread();
            }
        }

        function prevSpread() {
            if (isMobileView()) {
                if (currentPage > 0) {
                    currentPage--;
                    renderMobilePage('prev');
                }
                return;
            }
            if (currentSpread > 0) {
                currentSpread--;
                renderSpread();
            }
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const diary = document.getElementById('diary-container');
                if (!diary.classList.contains('visible')) return;
                if (isMobileView()) {
                    currentPage = Math.min(currentSpread * 2, flatPages.length - 1);
                    renderMobilePage();
                } else {
                    currentSpread = Math.min(Math.floor(currentPage / 2), spreads.length - 1);
                    renderSpread();
                }
            }, 200);
        });
    </script>
